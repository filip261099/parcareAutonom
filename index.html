<div id="overlay"></div>

<section id="panel" aria-label="Locuri Autonom">
  <div style="display:flex; justify-content:space-between; align-items:baseline">
    <h2>Locuri Autonom</h2>
    <span id="free" style="font-size:12px; color:#4a4f55"></span>
  </div>
  <form id="addForm" style="display:flex; flex-direction:column; gap:8px; margin:0">
    <label for="plate" style="font-size:12px; color:#4a4f55">Număr de înmatriculare</label>
    <div style="display:flex; gap:8px">
      <input id="plate" type="text" placeholder="BH 12 ABC" autocomplete="off">
      <button id="addBtn" type="submit">Adaugă</button>
    </div>
    <label for="rfr" style="display:flex; align-items:center; gap:8px; cursor:pointer">
      <input id="rfr" type="checkbox" checked style="width:16px; height:16px; margin:0">
      Mașina este RFR (gata de închiriere)
    </label>
    <label for="ret" style="display:flex; align-items:center; gap:8px; cursor:pointer">
      <input id="ret" type="checkbox" style="width:16px; height:16px; margin:0">
      Doar în tabel – trebuie să se întoarcă
    </label>
    <label for="eta" style="display:flex; align-items:center; gap:8px; padding-left:24px; font-size:12px; color:#4a4f55">
      Ora estimată de sosire
      <input id="eta" type="time" style="height:28px; border:1px solid #b9bec4; border-radius:5px; padding:0 6px; font-size:13px">
    </label>
    <div id="msg" style="font-size:12px; color:#a3401a; min-height:0"></div>
  </form>
  <div role="table" aria-label="Locuri Autonom">
    <div role="row" class="row head"><span>LOC</span><span>NR. ÎNMATRICULARE</span><span>RFR</span><span></span></div>
    <div id="rows"></div>
  </div>
  <div style="font-size:11px; color:#4a4f55; line-height:1.35"><span style="color:#1f5fae; font-weight:600">Albastru</span> = mașină care trebuie să se întoarcă; locul îi e păstrat. Apasă REVINE când sosește.</div>
</section>

<div id="legend">
  <div style="display:flex; flex-direction:column; gap:2px; flex:1">
    <div class="cond" style="font-weight:800; font-size:26px; letter-spacing:.5px; line-height:1.05">Aeroportul Internațional Oradea</div>
    <div style="font-size:14px; color:#4a4f55">Parcare publică · zona rent a car</div>
  </div>
  <div style="display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); column-gap:18px; row-gap:6px; font-size:13px; color:#2b3036">
    <div style="display:flex; align-items:center; gap:8px"><span class="sw" style="background:#4b5056"></span>Parcare publică</div>
    <div style="display:flex; align-items:center; gap:8px"><span class="sw" style="background:#E8772E"></span>Rent a car (R1–R15)</div>
    <div style="display:flex; align-items:center; gap:8px"><span class="sw" style="background:#2E9C8F"></span>Autonom (A1–A5)</div>
    <div style="display:flex; align-items:center; gap:8px"><span class="sw" style="background:#2a9d55"></span>Încărcare electrice</div>
  </div>
</div>
</div>
</div>

<script>
(function () {
  var KEY = 'parcare-oradea-autonom-v2';
  var XS = [489, 553, 617, 681, 745];
  var COLORS = ['#f2f3f4', '#c4c9ce', '#f2f3f4', '#4b5157', '#f2f3f4'];
  var DEFAULT = [{ plate: 'B127RXN', rfr: true }, { plate: 'B452ATL', ret: true, eta: '15:00' }, { plate: 'B302TOM', ret: true }, null, null];
  var slots, sel = -1;

  function load() {
    try { var v = JSON.parse(localStorage.getItem(KEY)); if (Array.isArray(v) && v.length === 5) return v; } catch (e) {}
    return DEFAULT.slice();
  }
  function save() { try { localStorage.setItem(KEY, JSON.stringify(slots)); } catch (e) {} }
  function esc(t) { return String(t).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }

  function carSvg(color, dot) {
    return '<svg width="46" height="98" viewBox="0 0 34 72" aria-hidden="true" style="display:block; overflow:visible; color:' + color + '">' +
      '<g transform="rotate(180 17 36)">' +
      '<rect x="3" y="4" width="32" height="70" rx="9" fill="#000" opacity="0.28"/>' +
      '<rect x="1" y="1" width="32" height="70" rx="9" fill="currentColor" stroke="#000" stroke-opacity="0.25"/>' +
      '<path d="M5 26 Q17 14 29 26 L27 31 Q17 27 7 31 Z" fill="#1c2630" opacity="0.88"/>' +
      '<path d="M7 52 Q17 55 27 52 L28 59 Q17 63 6 59 Z" fill="#1c2630" opacity="0.85"/>' +
      '<rect x="4" y="2.5" width="6" height="2.5" rx="1.2" fill="#fff6d8"/><rect x="24" y="2.5" width="6" height="2.5" rx="1.2" fill="#fff6d8"/>' +
      '<rect x="4" y="67.5" width="6" height="2.2" rx="1" fill="#c0262d"/><rect x="24" y="67.5" width="6" height="2.2" rx="1" fill="#c0262d"/>' +
      '</g><circle cx="17" cy="38" r="6" fill="' + dot + '" stroke="#fff" stroke-width="1.6"/></svg>';
  }

  function render() {
    var o = '';
    slots.forEach(function (c, i) {
      if (!c) return;
      if (c.ret) { o += '<div class="reserved" style="left:' + (XS[i] - 5) + 'px"></div>'; return; }
      o += '<button type="button" class="car" data-car="' + i + '" style="left:' + XS[i] + 'px" aria-label="Mașina ' + esc(c.plate) + '">' +
        carSvg(COLORS[i], c.rfr ? '#2a9d55' : '#e0702a') + '</button>';
    });
    var cur = sel >= 0 ? slots[sel] : null;
    if (cur && !cur.ret) {
      o += '<div class="pop" role="dialog" aria-label="Detalii mașină" style="left:' + (XS[sel] + 23 - 95) + 'px">' +
        '<div style="display:flex; justify-content:space-between; align-items:center; gap:8px"><span style="font-size:11px; color:#555b61; letter-spacing:.5px">LOC A' + (sel + 1) + ' · AUTONOM</span>' +
        '<button type="button" class="x" data-close="1" aria-label="Închide">×</button></div>' +
        '<div class="cond" style="font-weight:800; font-size:24px; letter-spacing:1px; line-height:1">' + esc(cur.plate) + '</div>' +
        '<div style="display:flex; align-items:center; gap:6px"><span class="pill" style="background:' + (cur.rfr ? '#1f7a43' : '#b5541a') + '">RFR: ' + (cur.rfr ? 'DA' : 'NU') + '</span>' +
        '<span style="font-size:12px; color:#4a4f55">' + (cur.rfr ? 'gata de închiriere' : 'nu e pregătită') + '</span></div></div>';
    }
    document.getElementById('overlay').innerHTML = o;

    var r = '';
    slots.forEach(function (c, i) {
      var plateColor = !c ? '#8a8f94' : (c.ret ? '#1f5fae' : '#1d2126');
      r += '<div role="row" class="row"><span style="font-weight:600; color:#1f6f66">A' + (i + 1) + '</span>' +
        '<span class="cond" style="font-size:16px; letter-spacing:.5px; color:' + plateColor + '">' + (c ? esc(c.plate) + (c.ret && c.eta ? ' <span style="font-size:13px">· ~' + esc(c.eta) + '</span>' : '') : 'liber') + '</span><span>';
      if (c) {
        var bg = c.ret ? '#1f5fae' : (c.rfr ? '#1f7a43' : '#b5541a');
        var lbl = c.ret ? 'REVINE' : (c.rfr ? 'DA' : 'NU');
        var tip = c.ret ? 'Marchează sosirea pentru ' : 'Schimbă RFR pentru ';
        r += '<button type="button" class="rfrBtn" data-toggle="' + i + '" style="background:' + bg + '" aria-label="' + tip + esc(c.plate) + '">' + lbl + '</button>';
      }
      r += '</span><span style="text-align:right">';
      if (c) r += '<button type="button" class="x" data-remove="' + i + '" aria-label="Scoate ' + esc(c.plate) + '">×</button>';
      r += '</span></div>';
    });
    document.getElementById('rows').innerHTML = r;
    var free = slots.filter(function (c) { return !c; }).length;
    document.getElementById('free').textContent = free + ' din 5 libere';
  }

  function msg(t) { document.getElementById('msg').textContent = t || ''; }

  document.getElementById('addForm').addEventListener('submit', function (e) {
    e.preventDefault();
    var input = document.getElementById('plate');
    var p = input.value.trim().toUpperCase().replace(/\s+/g, ' ');
    if (!p) return msg('Introdu un număr de înmatriculare.');
    if (slots.some(function (c) { return c && c.plate === p; })) return msg(p + ' este deja în listă.');
    var i = slots.indexOf(null);
    if (i < 0) return msg('Toate cele 5 locuri Autonom sunt ocupate.');
    slots[i] = document.getElementById('ret').checked ? { plate: p, ret: true, eta: document.getElementById('eta').value || '' } : { plate: p, rfr: document.getElementById('rfr').checked };
    input.value = ''; document.getElementById('eta').value = ''; msg(''); save(); render(); input.focus();
  });

  document.getElementById('stage').addEventListener('click', function (e) {
    var b = e.target.closest('button'); if (!b) return;
    if (b.dataset.car != null) { var i = +b.dataset.car; sel = sel === i ? -1 : i; render(); }
    else if (b.dataset.close) { sel = -1; render(); }
    else if (b.dataset.toggle != null) {
      var t = +b.dataset.toggle, c = slots[t];
      slots[t] = c.ret ? { plate: c.plate, rfr: false } : { plate: c.plate, rfr: !c.rfr };
      save(); render();
    } else if (b.dataset.remove != null) {
      var k = +b.dataset.remove; slots[k] = null; if (sel === k) sel = -1; save(); render();
    }
  });

  function fit() {
    var s = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
    s = Math.max(s, 0.45);
    document.getElementById('stage').style.transform = 'scale(' + s + ')';
    var f = document.getElementById('fit');
    f.style.width = (1920 * s) + 'px'; f.style.height = (1080 * s) + 'px';
  }
  window.addEventListener('resize', fit);

  slots = load(); fit(); render();
})();
</script>
</body>
